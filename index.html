<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ركيزة — مؤقت التركيز</title>
<meta name="description" content="ركيزة: مؤقت تركيز بتقنية بومودورو مع قائمة مهام، يعمل بالكامل في المتصفح.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c2410c'/><circle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/><rect x='14.5' y='5' width='3' height='9' rx='1.5' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="ركيزة">
    <svg viewBox="0 0 40 40" width="34" height="34" fill="none" aria-hidden="true">
      <circle cx="20" cy="22" r="13" stroke="currentColor" stroke-width="3.5"/>
      <rect x="18" y="4" width="4" height="14" rx="2" fill="var(--accent)"/>
    </svg>
    <span>ركيزة</span>
  </a>
  <button id="themeBtn" class="icon-btn" aria-label="تبديل الوضع الليلي">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="wrap">
  <section class="timer-card" aria-label="المؤقت">
    <div class="modes" role="tablist">
      <button class="mode active" data-mode="focus" role="tab">تركيز</button>
      <button class="mode" data-mode="short" role="tab">استراحة قصيرة</button>
      <button class="mode" data-mode="long" role="tab">استراحة طويلة</button>
    </div>

    <div class="dial">
      <svg viewBox="0 0 200 200" class="ring" aria-hidden="true">
        <circle cx="100" cy="100" r="88" class="track"/>
        <circle cx="100" cy="100" r="88" class="progress" id="progress"/>
      </svg>
      <div class="readout">
        <div id="time" class="time" aria-live="polite">25:00</div>
        <div id="label" class="label">وقت التركيز</div>
      </div>
    </div>

    <div class="controls">
      <button id="resetBtn" class="ghost" aria-label="إعادة ضبط">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button id="startBtn" class="primary">ابدأ</button>
      <button id="skipBtn" class="ghost" aria-label="تخطّي">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5 9 12l10 7z"/><path d="M5 5v14"/></svg>
      </button>
    </div>
    <p class="hint">اضغط <kbd>مسافة</kbd> للتشغيل والإيقاف</p>
  </section>

  <aside class="side">
    <section class="panel stats">
      <div><span id="sessions">0</span><small>جلسات اليوم</small></div>
      <div><span id="minutes">0</span><small>دقيقة تركيز</small></div>
      <div><span id="done">0</span><small>مهام منجزة</small></div>
    </section>

    <section class="panel tasks">
      <h2>مهام اليوم</h2>
      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text" placeholder="شو بدك تنجز؟" maxlength="80" autocomplete="off" aria-label="مهمة جديدة">
        <button type="submit" class="primary small">أضف</button>
      </form>
      <ul id="taskList" class="task-list"></ul>
      <p id="empty" class="empty">ما في مهام لسا. اكتب أول مهمة وابدأ جلسة تركيز.</p>
    </section>

    <section class="panel settings">
      <h2>المدد (بالدقائق)</h2>
      <div class="durations">
        <label>تركيز<input type="number" id="dFocus" min="1" max="90" value="25"></label>
        <label>قصيرة<input type="number" id="dShort" min="1" max="30" value="5"></label>
        <label>طويلة<input type="number" id="dLong" min="1" max="60" value="15"></label>
      </div>
    </section>
  </aside>
</main>

<footer class="foot">صُنع بواسطة Perplexity Computer · مستضاف على GitHub Pages</footer>
<script src="app.js"></script>
</body>
</html>
